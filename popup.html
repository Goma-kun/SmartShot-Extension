<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, "Hiragino Sans", sans-serif;
      width: 230px; margin: 0; padding: 14px 16px;
      background: #0f172a; color: #e2e8f0;
    }
    h2 { font-size: 15px; font-weight: 800; color: #38bdf8; margin: 0 0 12px; }
    .btn {
      width: 100%; padding: 10px;
      background: linear-gradient(135deg,#10b981,#06b6d4);
      border: none; border-radius: 9px;
      color: #0f172a; font-size: 14px; font-weight: 800;
      cursor: pointer; margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .shortcut {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; padding: 8px 12px;
      font-size: 12px; color: #94a3b8;
      display: flex; justify-content: space-between; align-items: center;
    }
    .shortcut kbd {
      background: #334155; border-radius: 4px;
      padding: 2px 6px; font-size: 11px; color: #e2e8f0;
      font-family: monospace;
    }
    .shortcut-row {
      display: flex; align-items: center; gap: 8px;
    }
    .change-link {
      background: none; border: none; padding: 0;
      color: #38bdf8; font-size: 11px; cursor: pointer;
      text-decoration: underline; font-family: inherit;
    }
    .change-link:hover { color: #7dd3fc; }
    .setting {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; padding: 8px 12px; margin-top: 8px;
      font-size: 12px; color: #94a3b8;
    }
    .setting label { display: block; margin-bottom: 6px; }
    #save-mode {
      width: 100%; padding: 6px 8px;
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      color: #e2e8f0; font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; -webkit-appearance: none; appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 8px center; background-size: 14px;
    }
    #save-mode:focus { outline: none; border-color: #38bdf8; }
    .note { font-size: 11px; color: #475569; margin-top: 10px; line-height: 1.5; }
    .log {
      margin-top: 10px; border-top: 1px solid #1e293b; padding-top: 8px;
      font-size: 10px; color: #64748b; line-height: 1.6;
    }
    .log b { color: #94a3b8; font-size: 11px; display: block; margin-bottom: 4px; }
    .log div { font-family: monospace; }
  </style>
</head>
<body>
  <h2>📷 SmartShot</h2>
  <button class="btn" id="shot-btn" data-i18n="popupButton"></button>
  <div class="shortcut">
    <span data-i18n="popupShortcut"></span>
    <div class="shortcut-row">
      <kbd id="shortcut-key">—</kbd>
      <button class="change-link" id="change-shortcut" data-i18n="popupChange"></button>
    </div>
  </div>
  <div class="setting">
    <label data-i18n="popupSaveMode"></label>
    <select id="save-mode">
      <option value="copy"></option>
      <option value="both"></option>
      <option value="save"></option>
    </select>
  </div>
  <p class="note" data-i18n="popupNote"></p>
  <div class="log" id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
